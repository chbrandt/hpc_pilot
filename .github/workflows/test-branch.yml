name: Test Branch

# Test branch workflow for homologation builds.
# Required GitHub settings:
#   - GITHUB_TOKEN: provided automatically by GitHub Actions
#   - permissions: contents: read, packages: write
#   - allows pushing a test-tag image to ghcr.io
# The workflow validates the repo, builds a test image, and uploads chart artifacts.
on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

jobs:
  test-branch:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: hpc-pilot-manager
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/hpc-pilot-manager
      CHART_DIR: charts/manager
      CHART_DEST: dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint manager chart
        run: helm lint charts/manager

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test Docker image
        run: |
          SHA_SHORT=${GITHUB_SHA:0:7}
          docker build -t ${{ env.IMAGE_REPO }}:test-$SHA_SHORT .
          docker push ${{ env.IMAGE_REPO }}:test-$SHA_SHORT

      - name: Package manager Helm chart
        run: |
          mkdir -p $CHART_DEST
          helm package $CHART_DIR --destination $CHART_DEST

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-manager-chart
          path: $CHART_DEST/*.tgz
