{{/*
ConfigMap: site_config.yaml
Mounted into the manager pod at /app/site_config.yaml.
Controls the cluster domain and wstunnel port used by the manager to
generate per-user InterLink chart values.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "manager.fullname" . }}-site-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
data:
  site_config.yaml: |
    rootDomain: {{ .Values.siteConfig.rootDomain }}
    subDomain: {{ .Values.siteConfig.subDomain }}

