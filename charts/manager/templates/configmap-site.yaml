{{/*
ConfigMap: site_config.yaml
Mounted into the manager pod at /app/site_config.yaml.
Controls the single site hostname, wstunnel ports, and optional VO access
restrictions used by the manager to generate per-user InterLink chart values
and to compute HPC wstunnel parameters.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "manager.fullname" . }}-site-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
data:
  site_config.yaml: |
    hostname: {{ .Values.siteConfig.hostname }}
    wstunnel:
      port: {{ .Values.siteConfig.wstunnel.port }}
      local_port: {{ .Values.siteConfig.wstunnel.localPort }}
    {{- with .Values.siteConfig.allowedGroups }}
    allowed_groups:
      {{- toYaml . | nindent 6 }}
    {{- end }}

