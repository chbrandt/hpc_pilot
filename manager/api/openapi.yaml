openapi: 3.1.0

info:
  title: HPC Pilot API
  description: |
    REST API layer for HPC Pilot.

    Exposes all manager operations as JSON endpoints under the `/api` prefix,
    suitable for use with cURL or any HTTP client.

    ## Authentication

    Every endpoint requires an EGI Check-in access token sent as a Bearer token
    in the `Authorization` header:

    ```
    Authorization: Bearer <token>
    ```

    The token is validated against EGI Check-in; the user's Kubernetes namespace
    is derived automatically from the `sub` claim.
  version: 1.0.0
  contact:
    url: https://github.com/chbrandt/hpc_pilot

servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: EGI Check-in OIDC authentication flows.
  - name: Kubernetes
    description: Container deployment operations (Kubernetes)
  - name: Helm
    description: Helm chart operations
  - name: HPC
    description: Remote HPC node operations (wstunnel + supervisord)

# ── Components ─────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EGI Check-in access token

  schemas:
    # ── Generic ──────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "'name' is required."

    OperationResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: string
          description: Present only when success is false

    # ── Kubernetes ────────────────────────────────────────────────────────────

    Port:
      type: object
      required: [number]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 65535
          example: 80
        name:
          type: string
          example: http
        protocol:
          type: string
          enum: [TCP, UDP]
          default: TCP

    IngressSpec:
      type: object
      properties:
        host:
          type: string
          description: Ingress hostname (empty string matches all)
          example: myapp.example.com
        path:
          type: string
          default: /
          example: /
        port:
          oneOf:
            - type: integer
            - type: string
          description: Target port number or name
          example: 80
        class:
          type: string
          description: Ingress class name
          example: nginx

    DeploymentRequest:
      type: object
      required: [name, image]
      properties:
        name:
          type: string
          description: Deployment name (RFC 1123, max 63 chars)
          example: my-nginx
        image:
          type: string
          description: Container image reference
          example: nginx:latest
        replicas:
          type: integer
          minimum: 1
          default: 1
          example: 1
        cpu_request:
          type: string
          description: Kubernetes CPU request
          example: "100m"
        cpu_limit:
          type: string
          description: Kubernetes CPU limit
          example: "500m"
        mem_request:
          type: string
          description: Kubernetes memory request
          example: "64Mi"
        mem_limit:
          type: string
          description: Kubernetes memory limit
          example: "256Mi"
        env_vars:
          type: object
          description: Environment variables as key/value pairs
          additionalProperties:
            type: string
          example:
            MY_VAR: hello
            ANOTHER: world
        ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"
          example:
            - number: 80
              name: http
              protocol: TCP
        command:
          type: string
          description: Shell command override (runs as `/bin/sh -c "<command>"`)
          example: "echo hello && sleep infinity"
        ingress:
          $ref: "#/components/schemas/IngressSpec"

    DeploymentResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            name:
              type: string
            namespace:
              type: string

    DeploymentSummary:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        image:
          type: string
        replicas:
          type: integer
        ready_replicas:
          type: integer
        status:
          type: string
          enum: [available, progressing, unknown]
        created:
          type: string
          format: date-time
        service_ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"
          nullable: true
        ingress_url:
          type: string
          nullable: true

    DeploymentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [available, progressing, unknown]
        replicas_status:
          type: string
          description: "Ready/total replicas, e.g. '2/2'"
          example: "2/2"
        ready_replicas:
          type: integer
          example: 2
        replicas:
          type: integer
          example: 2

    DeleteDeploymentResult:
      type: object
      properties:
        deployment:
          $ref: "#/components/schemas/OperationResult"
        service:
          $ref: "#/components/schemas/OperationResult"
          nullable: true
        ingress:
          $ref: "#/components/schemas/OperationResult"
          nullable: true

    # ── Helm ─────────────────────────────────────────────────────────────────

    HelmRelease:
      type: object
      properties:
        name:
          type: string
          example: my-release
        namespace:
          type: string
          example: user-abc123
        chart:
          type: string
          example: bitnami/nginx
        chart_version:
          type: string
          example: 15.0.2
        app_version:
          type: string
          example: 1.25.3
        status:
          type: string
          example: deployed
        updated:
          type: string
          format: date-time

    HelmInstallRequest:
      type: object
      required: [release_name, chart]
      properties:
        release_name:
          type: string
          description: Kubernetes-valid release name (RFC 1123, max 63 chars)
          example: my-release
        chart:
          type: string
          description: Chart reference (e.g. "bitnami/nginx" or OCI URL)
          example: bitnami/nginx
        version:
          type: string
          description: Specific chart version to pin
          example: "15.0.2"
        values_yaml:
          type: string
          description: Raw YAML values string (passed to `--values -`)
          example: |
            replicaCount: 2
            service:
              type: ClusterIP

    HelmInstallResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            release_name:
              type: string
            namespace:
              type: string
            output:
              type: string
              description: Raw output from `helm install`

    HelmUninstallResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            release_name:
              type: string
            output:
              type: string

    # ── Authentication ────────────────────────────────────────────────────────

    DeviceFlowResponse:
      type: object
      description: Payload returned to terminal/curl clients when a device flow is started.
      properties:
        flow:
          type: string
          enum: [device]
          example: device
        client_id:
          type: string
          description: OIDC client_id used for the flow.
          example: oidc-agent
        device_code:
          type: string
          description: Opaque device code used to poll for tokens (keep private).
          example: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
        user_code:
          type: string
          description: Short code the user enters at the verification URI.
          example: WDJB-MJHT
        verification_uri:
          type: string
          format: uri
          description: URL the user must open in a browser.
          example: "https://aai.egi.eu/device"
        verification_uri_complete:
          type: string
          format: uri
          description: |
            Pre-filled verification URL that combines `verification_uri`
            and `user_code` (open directly to skip manual entry).
          example: "https://aai.egi.eu/device?user_code=WDJB-MJHT"
        interval:
          type: integer
          description: Minimum seconds to wait between poll requests.
          example: 5
        expires_in:
          type: integer
          description: Seconds until the device code expires.
          example: 300
        poll_url:
          type: string
          description: Relative URL for polling device flow completion.
          example: /api/auth/checkin/device/poll
        instructions:
          type: string
          description: Human-readable instructions for completing the flow.

    DevicePollRequest:
      type: object
      required: [device_code]
      properties:
        device_code:
          type: string
          description: Device code obtained from `GET /api/auth/checkin`.
          example: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
        client_id:
          type: string
          description: OIDC client_id (defaults to the server-side configured value).
          example: oidc-agent

    TokenResponse:
      type: object
      description: Token response returned after successful OIDC authentication.
      properties:
        access_token:
          type: string
          description: OAuth 2.0 access token (JWT).
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 3600
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens.
        id_token:
          type: string
          description: OpenID Connect ID token (JWT).
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds (0 = non-expiring).
          example: 0

    # ── HPC ──────────────────────────────────────────────────────────────────

    HpcHostBody:
      type: object
      required: [hpc_host]
      properties:
        hpc_host:
          type: string
          description: HPC login node hostname or IP
          example: hpc.example.ac.uk
        ssh_port:
          type: integer
          description: SSH port on the HPC login node
          default: 22
          example: 22

    HpcDeployRequest:
      allOf:
        - $ref: "#/components/schemas/HpcHostBody"
        - type: object
          required: [wstunnel_server, wstunnel_secret]
          properties:
            wstunnel_server:
              type: string
              description: Kubernetes-side wstunnel server hostname
              example: wstunnel.k8s.example.com
            wstunnel_port:
              type: integer
              description: Port the wstunnel server listens on
              default: 8420
              example: 8420
            wstunnel_secret:
              type: string
              description: Shared tunnel secret
              example: my-super-secret
            wstunnel_local_port:
              type: integer
              description: |
                Local port on the HPC node that wstunnel binds to.
                Defaults to the value of `wstunnel_port`.
              example: 8420

    HpcOperationResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            output:
              type: string
              description: stdout/stderr captured from the remote command
            hpc_host:
              type: string

  responses:
    Unauthorized:
      description: |
        Missing, malformed, or expired Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing_header:
              value:
                error: "Missing or malformed Authorization header. Expected: Authorization: Bearer <token>"
                code: 401
            expired:
              value:
                error: "Token has expired."
                code: 401

    BadRequest:
      description: Request validation error (missing or invalid field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'release_name' is required."

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Deployment 'my-nginx' not found in namespace 'user-abc123'."

    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "connection refused"

  parameters:
    DeploymentName:
      name: name
      in: path
      required: true
      description: Deployment name
      schema:
        type: string
      example: my-nginx

# ── Paths ──────────────────────────────────────────────────────────────────────

paths:
  # ── Authentication ────────────────────────────────────────────────────────

  /api/auth/checkin:
    get:
      tags: [Authentication]
      summary: Initiate EGI Check-in authentication
      description: |
        Smart entry-point that detects the caller type and starts the
        appropriate OIDC flow:

        **Browser** (`Accept: text/html`)
        Redirects (`302`) to the EGI Check-in authorization endpoint using
        Authorization Code + PKCE (S256).  A `state` value and PKCE
        `code_verifier` are stored server-side in the Flask session.

        **curl / terminal** (no `text/html` Accept)
        Starts a Device Authorization Grant (RFC 8628) and returns a JSON
        payload immediately.  The operator opens `verification_uri` in any
        browser, enters `user_code`, and then polls
        `POST /api/auth/checkin/device/poll` until tokens arrive.
      operationId: checkin
      security: []
      responses:
        "302":
          description: |
            Browser clients only — redirect to EGI Check-in authorization URL.
          headers:
            Location:
              schema:
                type: string
              description: EGI Check-in authorization endpoint with PKCE parameters.
        "200":
          description: |
            Terminal/curl clients — device flow started successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowResponse"
              example:
                flow: device
                client_id: oidc-agent
                device_code: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
                user_code: "WDJB-MJHT"
                verification_uri: "https://aai.egi.eu/device"
                verification_uri_complete: "https://aai.egi.eu/device?user_code=WDJB-MJHT"
                interval: 5
                expires_in: 300
                poll_url: "/api/auth/checkin/device/poll"
                instructions: 'Open the verification_uri in a browser, enter the user_code, then POST {"device_code": "...", "client_id": "..."} to poll_url to retrieve your tokens.'
        "502":
          description: EGI Check-in device endpoint unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/checkin/callback:
    get:
      tags: [Authentication]
      summary: Authorization Code callback (browser only)
      description: |
        EGI Check-in redirects to this URL after the user approves the request.

        1. Validates `state` (CSRF check).
        2. Exchanges the `code` for tokens (PKCE).
        3. Stores tokens in the Flask session.
        4. Redirects the user to the application home page.

        This endpoint is intended for the IdP redirect — do not call it directly.
      operationId: checkinCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from EGI Check-in.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Opaque state value for CSRF validation.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code if the user denied access.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Human-readable error description.
          schema:
            type: string
      responses:
        "302":
          description: Tokens obtained and stored — redirect to application home.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: |
            Missing or mismatched `state`, missing `code`, or IdP error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Token exchange with EGI Check-in failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/checkin/device/poll:
    post:
      tags: [Authentication]
      summary: Poll device flow for tokens (terminal/curl)
      description: |
        Single-step poll of the EGI token endpoint.  Call this endpoint
        repeatedly (respecting the `interval` from the device flow response)
        until it returns HTTP 200 with tokens or HTTP 400 with a terminal error.

        | HTTP | Body | Meaning |
        |------|------|---------|
        | 200 | Token dict | User approved — tokens returned |
        | 202 | `{"status":"pending"}` | Not yet approved — retry |
        | 202 | `{"status":"slow_down"}` | Increase polling interval |
        | 400 | `{"error":"access_denied"}` | User denied — stop |
        | 400 | `{"error":"expired_token"}` | Code expired — restart |
        | 502 | `{"error":"..."}` | Network or server error |
      operationId: devicePoll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollRequest"
            example:
              device_code: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
              client_id: oidc-agent
      responses:
        "200":
          description: User approved — full token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "202":
          description: Authorization pending or slow-down requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, slow_down]
              example:
                status: pending
        "400":
          description: Terminal error (access denied, code expired, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Network error or unexpected response from EGI Check-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Kubernetes: Namespace ────────────────────────────────────────────────

  /api/namespaces/ensure:
    post:
      tags: [Kubernetes]
      summary: Ensure user namespace exists
      description: |
        Idempotently create the authenticated user's personal Kubernetes namespace
        (derived from the Bearer token's `sub` claim).

        Safe to call on every login — returns `{"created": false}` when the
        namespace already exists.
      operationId: ensureNamespace
      responses:
        "200":
          description: Namespace already existed
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: string
                    example: user-a3f1b2c4d5e6f7a8
                  created:
                    type: boolean
                    example: false
        "201":
          description: Namespace was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: string
                    example: user-a3f1b2c4d5e6f7a8
                  created:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Kubernetes: Deployments ───────────────────────────────────────────────

  /api/deployments:
    get:
      tags: [Kubernetes]
      summary: List deployments
      description: List all container deployments in the authenticated user's namespace.
      operationId: listDeployments
      responses:
        "200":
          description: Array of deployment summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeploymentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Kubernetes]
      summary: Create a deployment
      description: |
        Create a Kubernetes Deployment, and optionally a Service and Ingress,
        in the authenticated user's namespace (auto-created if absent).
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentRequest"
            examples:
              minimal:
                summary: Minimal — just name and image
                value:
                  name: my-nginx
                  image: nginx:latest
              full:
                summary: Full — resources, env vars, ports, ingress
                value:
                  name: my-app
                  image: myorg/myapp:1.2.3
                  replicas: 2
                  cpu_request: "100m"
                  cpu_limit: "500m"
                  mem_request: "64Mi"
                  mem_limit: "256Mi"
                  env_vars:
                    ENV: production
                  ports:
                    - number: 8080
                      name: http
                      protocol: TCP
                  ingress:
                    host: myapp.example.com
                    path: /
                    port: 8080
                    class: nginx
      responses:
        "201":
          description: Deployment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/deployments/{name}/status:
    get:
      tags: [Kubernetes]
      summary: Get deployment status
      description: Return the current rollout status for a single deployment.
      operationId: getDeploymentStatus
      parameters:
        - $ref: "#/components/parameters/DeploymentName"
      responses:
        "200":
          description: Deployment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentStatus"
              example:
                status: available
                replicas_status: "2/2"
                ready_replicas: 2
                replicas: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/deployments/{name}:
    delete:
      tags: [Kubernetes]
      summary: Delete a deployment
      description: |
        Delete a Deployment and its associated Service and Ingress (if they exist).
      operationId: deleteDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentName"
      responses:
        "200":
          description: Deletion result per resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeploymentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── InterLink ─────────────────────────────────────────────────────────────

  /api/interlink/deploy:
    post:
      tags: [Helm]
      summary: Deploy InterLink
      description: |
        Install the InterLink Helm chart into the authenticated user's namespace
        (auto-created if absent) using the default chart configuration defined
        in *charts_config.yaml*.

        No request body is required — all chart settings (reference, version,
        and values) come from the server-side configuration.

        This call is **synchronous** and blocks until `helm install --wait
        --timeout=5m0s` completes (up to five minutes).

        Only one InterLink deployment per user is allowed.
      operationId: deployInterlink
      responses:
        "201":
          description: InterLink chart installed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmInstallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Helm]
      summary: Remove InterLink deployment
      description: Run `helm uninstall` for the InterLink release in the user's namespace.
      operationId: deleteInterlink
      responses:
        "200":
          description: InterLink release uninstalled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmUninstallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/interlink/values:
    get:
      tags: [Helm]
      summary: Get InterLink deployment values
      description: |
        Return the user-supplied Helm values for the deployed InterLink release.
      operationId: getInterlinkValues
      responses:
        "200":
          description: Values retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  values_yaml:
                    type: string
                    nullable: true
                    description: Raw YAML string of user-supplied values, or null if none.
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── HPC ──────────────────────────────────────────────────────────────────

  /api/hpc/deploy:
    post:
      tags: [HPC]
      summary: Deploy HPC Pilot stack
      description: |
        Install wstunnel and supervisord on a remote HPC login node over SSH.

        The Bearer token is forwarded to the HPC node so that `motley_cue` /
        `ssh-oidc` can authenticate the SSH connection.
      operationId: hpcDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcDeployRequest"
            example:
              hpc_host: hpc.example.ac.uk
              ssh_port: 22
              wstunnel_server: wstunnel.k8s.example.com
              wstunnel_port: 8420
              wstunnel_secret: my-super-secret
      responses:
        "200":
          description: Deployment succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Deployment failed (SSH error, remote command failure, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"

