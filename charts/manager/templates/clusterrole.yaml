{{/*
ClusterRole — grants the manager the minimum Kubernetes permissions it needs:
  • Namespace management  (create user namespaces on login)
  • Job CRUD              (batch/v1 jobs via k8s_client.py, scheduled on InterLink nodes)
  • Service CRUD          (NodePort services alongside each job, for helm charts)
  • Ingress CRUD          (optional Ingress resources)
  • Node read             (to resolve the node IP shown in service_ports)
  • Pod read              (status polling)
  • ServiceAccount CRUD   (the InterLink chart creates a per-user SA for its VK pod)
  • RBAC CRUD             (the InterLink chart creates cluster- & namespace-scoped RBAC for its VK)

Helm chart management is handled by the `helm` CLI subprocess which inherits
the same kubeconfig / in-cluster ServiceAccount token — no extra CRDs needed.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "manager.fullname" . }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  # ── Namespace management ────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

  # ── Job management (batch/v1) ───────────────────────────────────────────────
  # k8s_client.py creates/lists/reads/deletes batch Jobs whose pods are
  # scheduled on InterLink virtual-kubelet nodes and forwarded to HPC.
  #
  # `watch` is required because the InterLink virtual-kubelet runs under this
  # same ServiceAccount and uses client-go informers to watch Jobs — both for
  # normal job handling and for the node-cleanup Job it creates on uninstall
  # (without `watch`, that watch gets 403 and `helm uninstall interlink` fails
  # with "failed to delete release").
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # ── Service management ──────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # ── Ingress management ──────────────────────────────────────────────────────
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]

  # ── Node read (for external IP resolution) ──────────────────────────────────
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # ── Pod read (job status polling) ───────────────────────────────────────────
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # ── ConfigMap / Secret access for Helm ─────────────────────────────────────
  # Helm stores release data as Secrets in the target namespace.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]

  # ── Events (Helm and Kubernetes write events on resource changes) ───────────
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

  # ── Deployments / ReplicaSets ───────────────────────────────────────────────
  # Granted so the same identity can run arbitrary `helm install` charts
  # (e.g. the InterLink chart) that may create Deployments/ReplicaSets.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "create", "delete"]

  # ── ServiceAccount management (InterLink chart) ─────────────────────────────
  # The InterLink Helm chart creates a dedicated ServiceAccount
  # (virtual-node-<namespace>) in each user namespace for its virtual-kubelet
  # pod.  Helm needs `get` for the pre-flight conflict check / three-way
  # merge lookup, plus `create`/`delete` for install and uninstall.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "delete"]

  # ── RBAC management (InterLink chart) ───────────────────────────────────────
  # The InterLink chart creates both cluster-scoped RBAC (a ClusterRole +
  # ClusterRoleBinding for its virtual-kubelet, so it can manage
  # pods/nodes/leases/…) and namespace-scoped RBAC (a Role such as
  # `interlink-node-reader` + RoleBinding, in each user namespace).
  # `helm install`/`uninstall` therefore needs get/create/delete on all
  # four RBAC resource kinds.  (Granting clusterrolebindings/rolebindings
  # lets the manager bind arbitrary roles — an inherent consequence of
  # running a chart that creates RBAC under its own identity; see the chart
  # README.)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "create", "delete"]
