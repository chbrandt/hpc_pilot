{{- if not .Values.flask.existingSecret }}
{{/*
Create a Secret for FLASK_SECRET_KEY only when the operator has not supplied
an existing secret reference. In production always set flask.secretKey to a
strong random value:

  helm install manager ./charts/manager \
    --set flask.secretKey="$(python -c 'import secrets; print(secrets.token_hex(32))')"

or point to a pre-existing secret:

  helm install manager ./charts/manager \
    --set flask.existingSecret=my-secret \
    --set flask.existingSecretKey=flask-secret-key
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manager.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  flask-secret-key: {{ .Values.flask.secretKey | default "dev-secret-change-in-production" | quote }}
{{- end }}
