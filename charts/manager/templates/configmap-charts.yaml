{{/*
ConfigMap: charts_config.yaml
Mounted into the manager pod at /app/charts_config.yaml.
Defines the default Helm charts pre-seeded into every user's saved-config
store on first login (including the InterLink chart).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "manager.fullname" . }}-charts-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
data:
  charts_config.yaml: |
    default_charts:
      - kind: helm
        release_name: interlink
        chart: {{ .Values.interlinkConfig.chart }}
        version: {{ .Values.interlinkConfig.version }}
        singleton: true
        description: "InterLink virtual-kubelet node (wstunnel + interLink API server)"
        values_yaml: |
          nodeName: virtual-node-__NAMESPACE__
          interlink:
            enabled: true
            address: {{ .Values.interlinkConfig.interlink.address | default "http://0.0.0.0" }}
            port: {{ .Values.interlinkConfig.interlink.port | default 3000 }}
          plugin:
            enabled: false
            address: {{ .Values.interlinkConfig.plugin.address | default "http://0.0.0.0" }}
            port: {{ .Values.interlinkConfig.plugin.port | default 4000 }}
          wstunnel:
            enabled: true
            port: {{ .Values.interlinkConfig.wstunnel.port | default 8080 }}
            ingress:
              host: {{ .Values.interlinkConfig.wstunnel.ingress.host | default "__HOSTNAME__" }}
            logLevel: {{ .Values.interlinkConfig.wstunnel.logLevel | default "debug" }}
            secret: {{ .Values.interlinkConfig.wstunnel.secret | default "__NAMESPACE__" }}
