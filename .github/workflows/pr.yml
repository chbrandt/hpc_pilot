name: Pull Request Validation

# PR validation workflow for code and chart checks.
# No artifacts are published by this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # push:
  #   branches:
  #     - main
  #     - test

permissions:
  contents: read

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint manager chart
        run: helm lint charts/manager

      - name: Validate Docker build
        run: docker build --target base -t pr-hpc-pilot-manager .
