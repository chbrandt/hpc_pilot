# site_config.yaml — Operator-level site settings for HPC Pilot Manager
#
# This file contains settings that describe the deployment environment and
# are independent of any specific Helm chart or user workflow.
# It is read at the api/app layer; the lib/ layer never touches it directly.
#
# Fields
# ------
# cluster_domain : str
#     Wildcard base domain of the Kubernetes cluster.
#     Each user's InterLink deployment will be reachable at
#     "<user-namespace>.<cluster_domain>".
#     Example: for a wildcard certificate "*.dev.local" set this to "dev.local".

cluster_domain: dev.local

wstunnel:
  # Port on which the wstunnel server listens for incoming connections.
  # This should match the port configured in the wstunnel server deployment.
  port: 80

  # Local port on which the wstunnel client will listen for forwarded connections.
  # This can be set to any available port on the local machine.
  local_port: 4000
