{{/*
ClusterRole — grants the manager the minimum Kubernetes permissions it needs:
  • Namespace management  (create user namespaces on login)
  • Job CRUD              (batch/v1 jobs via k8s_client.py, scheduled on InterLink nodes)
  • Service CRUD          (NodePort services alongside each job, for helm charts)
  • Ingress CRUD          (optional Ingress resources)
  • Node read             (to resolve the node IP shown in service_ports)
  • Pod read              (status polling)

Helm chart management is handled by the `helm` CLI subprocess which inherits
the same kubeconfig / in-cluster ServiceAccount token — no extra CRDs needed.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "manager.fullname" . }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  # ── Namespace management ────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

  # ── Job management (batch/v1) ───────────────────────────────────────────────
  # k8s_client.py creates/lists/reads/deletes batch Jobs whose pods are
  # scheduled on InterLink virtual-kubelet nodes and forwarded to HPC.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]

  # ── Service management ──────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # ── Ingress management ──────────────────────────────────────────────────────
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]

  # ── Node read (for external IP resolution) ──────────────────────────────────
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # ── Pod read (job status polling) ───────────────────────────────────────────
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # ── ConfigMap / Secret access for Helm ─────────────────────────────────────
  # Helm stores release data as Secrets in the target namespace.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]

  # ── Events (Helm and Kubernetes write events on resource changes) ───────────
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

  # ── Deployments / ReplicaSets ───────────────────────────────────────────────
  # Granted so the same identity can run arbitrary `helm install` charts
  # (e.g. the InterLink chart) that may create Deployments/ReplicaSets.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "create", "delete"]
