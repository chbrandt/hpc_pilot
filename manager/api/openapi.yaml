openapi: 3.1.0

info:
  title: HPC Pilot API
  description: |
    REST API layer for HPC Pilot.

    Exposes all manager operations as JSON endpoints under the `/api` prefix,
    suitable for use with cURL or any HTTP client.

    ## Authentication

    Every endpoint requires an EGI Check-in access token sent as a Bearer token
    in the `Authorization` header:

    ```
    Authorization: Bearer <token>
    ```

    The token is validated against EGI Check-in; the user's Kubernetes namespace
    is derived automatically from the `sub` claim.
  version: 1.0.0
  contact:
    url: https://github.com/chbrandt/hpc_pilot

servers:
  # Relative URL: Swagger UI ("Try it out") resolves it against the origin
  # serving this spec — http://localhost:5000 in local dev, https://<fqdn>
  # behind an Ingress.  Do NOT use an absolute http://localhost:5000 here:
  # the browser would send "Try it out" requests to the *user's* machine.
  - url: /
    description: this

security:
  - bearerAuth: []

tags:
  - name: Kubernetes
    description: Container job operations (Kubernetes + InterLink)
  - name: Helm
    description: Helm chart operations
  - name: HPC
    description: Remote HPC node operations (wstunnel + supervisord)

# ── Components ─────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EGI Check-in access token

  schemas:
    # ── Generic ──────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "'name' is required."

    OperationResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: string
          description: Present only when success is false

    # ── Kubernetes / Jobs ─────────────────────────────────────────────────────

    JobRequest:
      type: object
      required: [name, image, node_name]
      properties:
        name:
          type: string
          description: |
            Job name — must be a valid RFC 1123 DNS label (lowercase alphanumeric
            and hyphens, max 63 characters).
          example: my-ubuntu-job
        image:
          type: string
          description: Container image reference
          example: docker://ubuntu:22.04
        node_name:
          type: string
          description: |
            Name of the InterLink virtual-kubelet node on which the job must run.
            Sets `spec.nodeSelector["kubernetes.io/hostname"]` on the pod template.
          example: vk-node-1
        env_vars:
          type: object
          description: Environment variables as key/value pairs
          additionalProperties:
            type: string
          example:
            MY_VAR: hello
            ANOTHER: world
        command:
          type: string
          description: Shell command override (runs as `/bin/sh -c "<command>"`)
          example: "echo hello && sleep infinity"

    JobResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            job_name:
              type: string
              description: Name of the created Kubernetes Deployment
              example: my-ubuntu-job
            namespace:
              type: string
              example: user-a3f1b2c4d5e6f7a8
            image:
              type: string
              example: docker://ubuntu:22.04
            node_name:
              type: string
              description: InterLink virtual-kubelet node the pod is pinned to
              example: vk-node-1
            status:
              type: string
              enum: [progressing, available, unknown]
              example: progressing

    JobSummary:
      type: object
      properties:
        name:
          type: string
          example: my-ubuntu-job
        namespace:
          type: string
          example: user-a3f1b2c4d5e6f7a8
        image:
          type: string
          example: docker://ubuntu:22.04
        node_name:
          type: string
          description: InterLink virtual-kubelet node the pod is pinned to
          example: vk-node-1
        status:
          type: string
          enum: [available, progressing, unknown]
          example: available
        created:
          type: string
          format: date-time

    JobSpec:
      type: object
      description: |
        Full job specification as stored in the cluster — mirrors the parameters
        accepted by `POST /api/jobs` and can be used to re-submit the job.
      properties:
        name:
          type: string
          example: my-ubuntu-job
        image:
          type: string
          example: docker://ubuntu:22.04
        node_name:
          type: string
          example: vk-node-1
        env_vars:
          type: object
          additionalProperties:
            type: string
          nullable: true
        command:
          type: string
          nullable: true

    JobStatus:
      type: object
      properties:
        name:
          type: string
          example: my-ubuntu-job
        namespace:
          type: string
          example: user-a3f1b2c4d5e6f7a8
        status:
          type: string
          enum: [available, progressing, unknown]
          example: available
        ready:
          type: integer
          example: 1
        image:
          type: string
          example: docker://ubuntu:22.04
        created:
          type: string
          format: date-time

    DeleteJobResult:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/OperationResult"

    # ── Helm ─────────────────────────────────────────────────────────────────

    HelmRelease:
      type: object
      properties:
        name:
          type: string
          example: my-release
        namespace:
          type: string
          example: user-abc123
        chart:
          type: string
          example: bitnami/nginx
        chart_version:
          type: string
          example: 15.0.2
        app_version:
          type: string
          example: 1.25.3
        status:
          type: string
          example: deployed
        updated:
          type: string
          format: date-time

    HelmInstallRequest:
      type: object
      required: [release_name, chart]
      properties:
        release_name:
          type: string
          description: Kubernetes-valid release name (RFC 1123, max 63 chars)
          example: my-release
        chart:
          type: string
          description: Chart reference (e.g. "bitnami/nginx" or OCI URL)
          example: bitnami/nginx
        version:
          type: string
          description: Specific chart version to pin
          example: "15.0.2"
        values_yaml:
          type: string
          description: Raw YAML values string (passed to `--values -`)
          example: |
            replicaCount: 2
            service:
              type: ClusterIP

    HelmInstallResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            release_name:
              type: string
            namespace:
              type: string
            output:
              type: string
              description: Raw output from `helm install`

    HelmUninstallResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            release_name:
              type: string
            output:
              type: string

    # ── HPC ──────────────────────────────────────────────────────────────────

    HpcNameBody:
      type: object
      required: [hpc_name]
      properties:
        hpc_name:
          type: string
          description: |
            HPC node name — matches a config file in `manager/hpc/<name>.yaml`.
            The hostname, SSH port, and plugin are read from that file.
          example: test-echo

    HpcNode:
      type: object
      properties:
        name:
          type: string
          description: HPC node name (filename stem of the config file)
          example: test-echo
        hostname:
          type: string
          description: HPC login node hostname or IP
          example: 161.9.255.206
        ssh_port:
          type: integer
          description: SSH port on the HPC login node
          example: 3333
        plugin:
          type: string
          description: InterLink plugin to install on the HPC node
          enum: [echo, docker, slurm]
          example: echo

    HpcDeployRequest:
      $ref: "#/components/schemas/HpcNameBody"

    HpcOperationResult:
      allOf:
        - $ref: "#/components/schemas/OperationResult"
        - type: object
          properties:
            output:
              type: string
              description: stdout/stderr captured from the remote command

  responses:
    Unauthorized:
      description: |
        Missing, malformed, or expired Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing_header:
              value:
                error: "Missing or malformed Authorization header. Expected: Authorization: Bearer <token>"
                code: 401
            expired:
              value:
                error: "Token has expired."
                code: 401

    BadRequest:
      description: Request validation error (missing or invalid field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'node_name' is required."

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Job 'my-ubuntu-job' not found in namespace 'user-abc123'."

    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "connection refused"

  parameters:
    JobName:
      name: name
      in: path
      required: true
      description: Job name (Kubernetes Deployment name)
      schema:
        type: string
      example: my-ubuntu-job

# ── Paths ──────────────────────────────────────────────────────────────────────

paths:
  # ── Kubernetes: Namespace ────────────────────────────────────────────────

  /api/namespaces/ensure:
    post:
      tags: [Kubernetes]
      summary: Ensure user namespace exists
      description: |
        Idempotently create the authenticated user's personal Kubernetes namespace
        (derived from the Bearer token's `sub` claim).

        Safe to call on every login — returns `{"created": false}` when the
        namespace already exists.
      operationId: ensureNamespace
      responses:
        "200":
          description: Namespace already existed
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: string
                    example: user-a3f1b2c4d5e6f7a8
                  created:
                    type: boolean
                    example: false
        "201":
          description: Namespace was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: string
                    example: user-a3f1b2c4d5e6f7a8
                  created:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Kubernetes: InterLink nodes ──────────────────────────────────────────

  /api/nodes/interlink:
    get:
      tags: [Kubernetes]
      summary: List InterLink virtual-kubelet nodes
      description: |
        Return the names of cluster nodes that carry the
        `virtual-node.interlink/no-schedule` taint — these are the nodes that
        forward pods to HPC batch jobs via InterLink.

        Use the returned names as the `node_name` value when submitting a job.
      operationId: listInterlinkNodes
      responses:
        "200":
          description: List of InterLink node names
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: string
                    example: ["vk-node-1", "vk-node-2"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Kubernetes: Jobs ─────────────────────────────────────────────────────

  /api/jobs:
    get:
      tags: [Kubernetes]
      summary: List jobs
      description: |
        List all container jobs in the authenticated user's namespace.

        Jobs are Kubernetes Deployments whose pod template is pinned to an
        InterLink virtual-kubelet node.  InterLink translates each pod into an
        HPC batch job.  Replica counts, resource requests/limits, container
        ports, and Ingress are not supported.
      operationId: listJobs
      responses:
        "200":
          description: Array of job summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Kubernetes]
      summary: Submit a job
      description: |
        Create a Kubernetes Deployment whose pod is scheduled on the specified
        InterLink virtual-kubelet node.

        The pod template always sets:
        - `spec.nodeSelector["kubernetes.io/hostname"]` = `node_name`
        - `spec.tolerations` = `[{key: virtual-node.interlink/no-schedule, operator: Exists}]`

        InterLink translates the pod into an HPC batch job; therefore replica
        counts, CPU/memory resource requests and limits, container port
        definitions, and Ingress are **not supported** and are not accepted by
        this endpoint.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
            examples:
              minimal:
                summary: Minimal — name, image, and node
                value:
                  name: my-ubuntu-job
                  image: docker://ubuntu:22.04
                  node_name: vk-node-1
              with_env_and_command:
                summary: With environment variables and command override
                value:
                  name: my-sim
                  image: myorg/simulation:1.0
                  node_name: vk-node-1
                  env_vars:
                    THREADS: "8"
                    DATA_PATH: /scratch/data
                  command: "python run.py --threads $THREADS"
      responses:
        "201":
          description: Job submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/jobs/{name}:
    get:
      tags: [Kubernetes]
      summary: Get job spec
      description: |
        Return the full specification of a single job as stored in the cluster.

        The returned object mirrors the `POST /api/jobs` request body and can
        be used to re-submit the same job.
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Job specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSpec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Kubernetes]
      summary: Delete a job
      description: |
        Delete the Kubernetes Deployment for this job.

        Only the Deployment is deleted; no Service or Ingress is created by
        the job API, so none needs to be removed.
      operationId: deleteJob
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteJobResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/jobs/{name}/status:
    get:
      tags: [Kubernetes]
      summary: Get job status
      description: |
        Return the current rollout status for a single job.

        The `status` field maps Kubernetes Deployment conditions to display states:
        - `available` — `Available=True`
        - `progressing` — `Progressing=True` and not yet available
        - `unknown` — no recognised condition
      operationId: getJobStatus
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
              example:
                name: my-ubuntu-job
                namespace: user-a3f1b2c4d5e6f7a8
                status: available
                replicas_status: "1/1"
                ready_replicas: 1
                available_replicas: 1
                updated_replicas: 1
                replicas: 1
                image: docker://ubuntu:22.04
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── InterLink ─────────────────────────────────────────────────────────────

  /api/interlink:
    post:
      tags: [Helm]
      summary: Deploy InterLink
      description: |
        Install the InterLink Helm chart into the authenticated user's namespace
        (auto-created if absent) using the default chart configuration defined
        in *charts_config.yaml*.

        No request body is required — all chart settings (reference, version,
        and values) come from the server-side configuration.

        This call is **synchronous** and blocks until `helm install --wait
        --timeout=5m0s` completes (up to five minutes).

        Only one InterLink deployment per user is allowed.
      operationId: deployInterlink
      responses:
        "201":
          description: InterLink chart installed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmInstallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Helm]
      summary: Remove InterLink deployment
      description: Run `helm uninstall` for the InterLink release in the user's namespace.
      operationId: deleteInterlink
      responses:
        "200":
          description: InterLink release uninstalled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmUninstallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Helm]
      summary: Get InterLink deployment values
      description: |
        Return the user-supplied Helm values for the deployed InterLink release.
      operationId: getInterlinkValues
      responses:
        "200":
          description: Values retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  values_yaml:
                    type: string
                    nullable: true
                    description: Raw YAML string of user-supplied values, or null if none.
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── HPC ──────────────────────────────────────────────────────────────────

  /api/hpc/nodes:
    get:
      tags: [HPC]
      summary: List available HPC nodes
      description: |
        Return all HPC nodes defined by config files in `manager/hpc/*.yaml`.

        Each entry includes the node name, hostname, SSH port, and plugin.
        Use the `name` field as the `hpc_name` parameter in other HPC endpoints.
      operationId: listHpcNodes
      responses:
        "200":
          description: List of available HPC nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/HpcNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/hpc/deploy:
    post:
      tags: [HPC]
      summary: Deploy HPC Pilot stack
      description: |
        Install wstunnel and supervisord on a remote HPC login node over SSH.

        The HPC node's hostname, SSH port, and plugin are read from the
        config file `manager/hpc/<hpc_name>.yaml`.  The Bearer token is
        forwarded to the HPC node so that `motley_cue` / `ssh-oidc` can
        authenticate the SSH connection.
      operationId: hpcDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcDeployRequest"
            example:
              hpc_name: test-echo
      responses:
        "200":
          description: Deployment succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Deployment failed (SSH error, remote command failure, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"

    delete:
      tags: [HPC]
      summary: Uninstall HPC deployment
      description: |
        Stop all supervisord-managed services, shut down supervisord, and remove
        the ``~/.pilot`` installation directory from the remote HPC node.

        This is the inverse of `POST /api/hpc/deploy`.  The operation is
        idempotent — it is safe to call even if services were never started or
        the directory does not exist.
      operationId: hpcUndeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcNameBody"
            example:
              hpc_name: test-echo
      responses:
        "200":
          description: Uninstallation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Uninstallation failed (SSH error, remote command failure, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"

  /api/hpc/status:
    post:
      tags: [HPC]
      summary: Query HPC service status
      description: Run `supervisorctl status` on the remote HPC node and return the output.
      operationId: hpcStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcNameBody"
            example:
              hpc_name: test-echo
      responses:
        "200":
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/hpc/start:
    post:
      tags: [HPC]
      summary: Start HPC services
      description: Run `supervisorctl start all` on the remote HPC node.
      operationId: hpcStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcNameBody"
            example:
              hpc_name: test-echo
      responses:
        "200":
          description: Services started successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/hpc/stop:
    post:
      tags: [HPC]
      summary: Stop HPC services
      description: Run `supervisorctl stop all` on the remote HPC node.
      operationId: hpcStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HpcNameBody"
            example:
              hpc_name: test-echo
      responses:
        "200":
          description: Services stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HpcOperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
