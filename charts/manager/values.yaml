# ── Persistent storage for saved deployment configs ────────────────────────────
persistence:
  enabled: false
  # storageClass: ""   # leave blank to use the cluster default StorageClass
  accessMode: ReadWriteOnce
  size: 1Gi
  # existingClaim: ""  # use a pre-existing PVC instead of creating one

# # ── Service ────────────────────────────────────────────────────────────────────
# service:
#   type: ClusterIP
#   port: 80

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  port: 80
  annotations:
    # Allow long-running helm install --wait requests (up to 6 minutes)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "360"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "360"
  tls:
    - secretName: manager-tls
      hosts:
        - app.hpc-pilot.test.fedcloud.eu
        # - "*.hpc-pilot.test.fedcloud.eu"

# ── Resource limits ────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

