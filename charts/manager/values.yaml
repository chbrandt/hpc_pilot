# values.yaml — Default configuration for the HPC Pilot Manager Helm chart.
#
# Override any of these values in a custom values file:
#   helm install manager ./charts/manager -f my-values.yaml

# ── Namespace ──────────────────────────────────────────────────────────────────
namespace: hpc-pilot

# ── Container image ────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/chbrandt/hpc-pilot-manager
  tag: latest
  pullPolicy: Always
  # pullSecrets:
  #   - name: my-registry-secret

# ── Replica count ──────────────────────────────────────────────────────────────
replicaCount: 1

# ── Flask configuration ────────────────────────────────────────────────────────
flask:
  port: 5000
  debug: "0"
  # secretKey: supply a strong random value here or reference an existing secret.
  # If left empty a placeholder value is used (NOT safe for production).
  secretKey: "ok-for-dev-only-change-me--in-prod-use-a-secret-or-random-value"

  # Reference an existing Secret instead of creating one from secretKey above.
  # When set, 'flask.secretKey' is ignored.
  existingSecret: ""
  existingSecretKey: "flask-secret-key"

# ── Site configuration (written into site_config.yaml ConfigMap) ───────────────
siteConfig:
  # Single fixed hostname the manager and every user's InterLink wstunnel
  # endpoint are exposed on. No wildcard DNS / wildcard TLS needed: each user's
  # tunnel is reached at <hostname>/<namespace> via path-prefix routing.
  hostname: darrel-suprasegmental-podgily.ngrok-free.dev

  wstunnel:
    # Port the wstunnel Ingress listens on (the port the HPC-side wstunnel
    # client connects to).
    port: 443
    # Local TCP port on the HPC edge-node that wstunnel forwards to the
    # InterLink plugin.
    localPort: 4000

  # Optional list of EGI VO entitlement substrings that restrict login.
  # When non-empty, only users whose UserInfo contains at least one of these
  # substrings are granted access. Leave empty for open access (any
  # authenticated EGI user).
  allowedGroups: []
    # - "vo.access.egi.eu"
    # - "hpc-wg"

interlinkConfig:
  chart: oci://ghcr.io/chbrandt/interlink-helm-chart/interlink
  version: 0.6.1-egi.5

  # You probably don't need to change the values below.
  #
  # Note: the wstunnel ingress host, external port, internal port and secret
  # are NOT configurable here — they are derived from `siteConfig`
  # (hostname, wstunnel.port, wstunnel.localPort) and from the per-user
  # namespace (`__NAMESPACE__`), so every user's tunnel stays consistent
  # with the site-level routing configuration.
  wstunnel:
    logLevel: debug
    # Port on which the wstunnel server in the InterLink pod listens.
    port: 8080

  virtualNode:
    # Do not request a cluster-signed kubelet serving certificate via a CSR.
    # With disableCSR true the virtual-kubelet serves its :10250 endpoint with
    # a self-signed cert, which the kube-apiserver accepts when running with
    # --kubelet-insecure-tls (the InterLink chart's HTTP.insecure /
    # kubeletHTTP.insecure defaults).  Avoids the kubelet-serving CSR
    # approval/signing pipeline that otherwise gates job output retrieval on
    # TLS verification.
    disableCSR: true

  interlink:
    # Port on which the InterLink API server in the InterLink pod listens.
    port: 3000
    # Address that the InterLink API server binds to inside the InterLink pod.
    address: http://0.0.0.0
    # Disable projected service-account token volumes on the virtual-kubelet
    # pod (avoids mounting K8s secrets into HPC-side jobs).
    disableProjectedVolumes: true

  plugin:
    # Port on which the plugin API server in the HPC edge-node listens.
    port: 4000
    # Address that the plugin API server binds to inside the HPC edge-node.
    address: http://0.0.0.0

# ── Persistent storage for saved deployment configs ────────────────────────────
persistence:
  enabled: false
  # storageClass: ""   # leave blank to use the cluster default StorageClass
  accessMode: ReadWriteOnce
  size: 1Gi
  # existingClaim: ""  # use a pre-existing PVC instead of creating one

# # ── Service ────────────────────────────────────────────────────────────────────
# service:
#   type: ClusterIP
#   port: 80

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  port: 80
  annotations:
    # Allow long-running helm install --wait requests (up to 6 minutes)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "360"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "360"
  tls:
    # TLS for siteConfig.hostname. The chart derives the host list from
    # siteConfig.hostname — only the secret name is configurable here.
    enabled: true
    secretName: manager-tls
    # - A certificate for siteConfig.hostname must exist in the secret.

# ── Resource limits ────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# # ── Service account ────────────────────────────────────────────────────────────
# serviceAccount:
#   # Name of the ServiceAccount to create and bind to the ClusterRole.
