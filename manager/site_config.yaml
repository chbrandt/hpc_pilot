# site_config.yaml — Operator-level site settings for HPC Pilot Manager
#
# This file contains settings that describe the deployment environment and
# are independent of any specific Helm chart or user workflow.
# It is read at the api/app layer; the lib/ layer never touches it directly.
#
# Fields
# ------
# hostname : str
#     The hostname for the site.
#     Example: "ngrok.dev"

hostname: ngrok.dev

wstunnel:
  port: 80
  local_port: 4000

# Optional: restrict login to users who hold at least one of these
# entitlement substrings (checked against 'eduperson_entitlement' and
# 'entitlements' JWT claims using substring matching).
# Leave the list empty or omit the key entirely to allow any authenticated
# EGI Check-in user.
# If allowed_groups is empty, access is unrestricted.
#
# Example (uncomment and edit as needed):
# allowed_groups: []
allowed_groups:
  # - "vo.access.egi.eu"
  # - "vo.notebooks.egi.eu"
  - "hpc-wg"
