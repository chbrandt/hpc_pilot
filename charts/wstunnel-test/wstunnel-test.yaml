apiVersion: v1
kind: Namespace
metadata:
  name: test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wstunnel-server
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wstunnel-server
  template:
    metadata:
      labels:
        app: wstunnel-server
    spec:
      containers:
        - name: curl
          image: curlimages/curl:latest
          command: ["sh", "-c", "sleep infinity"]
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
        - name: wstunnel
          image: ghcr.io/erebe/wstunnel:latest
          args:
            - "./wstunnel"
            - "server"
            - "--restrict-http-upgrade-path-prefix"
            - "h3GywpDrP6gJEdZ6xbJbZZVFmvFZDCa4KcRd"
            - "ws://0.0.0.0:8080"
          ports:
            - containerPort: 8080
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: wstunnel-service
  namespace: test
spec:
  selector:
    app: wstunnel-server
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wstunnel-ingress
  namespace: test
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "wstunnel-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: test.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wstunnel-service
                port:
                  number: 8080
