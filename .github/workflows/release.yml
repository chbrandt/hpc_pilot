name: Release

# Release workflow for production artifact publishing.
# Required GitHub settings:
#   - GITHUB_TOKEN: provided automatically by GitHub Actions
#   - permissions: contents: write, packages: write
#   - allows pushing to ghcr.io for the manager image
on:
  push:
    # The broad glob admits candidate release tags. Strict, whole-tag
    # validation is done in the "Validate release tag" step below with a
    # regular expression, because the `tags` filter cannot express that level
    # of strictness.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: hpc-pilot-manager
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/hpc-pilot-manager
      CHART_DIR: charts/manager
      CHART_DEST: dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Strict release-tag grammar (extended regular expression):
          #   v<major>[.<minor>[.<patch>]][-<pre-release>]
          # - 1 to 3 dot-separated numeric segments; no leading zeros (a lone "0" is allowed)
          # - optional pre-release starting with an alphanumeric character, then any mix
          #   of alphanumerics, dots and hyphens (e.g. alpha, rc1, pr.1)
          regex='^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$tag" =~ $regex ]]; then
            echo "::error::Tag '$tag' is not a valid release tag. Expected forms like v2, v1.7, v1.2.3, v2-alpha, v1.7-rc, v1.2.3-pr.1"
            exit 1
          fi
          echo "Release tag '$tag' is valid."

      - name: Set release version
        id: release_vars
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.release_vars.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Package manager Helm chart
        run: |
          mkdir -p $CHART_DEST
          helm package $CHART_DIR --destination $CHART_DEST \
            --version "${{ steps.release_vars.outputs.tag }}" \
            --app-version "${{ steps.release_vars.outputs.tag }}"

      - name: Publish release chart artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release generated from tag ${{ github.ref_name }}."
          files: dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
