apiVersion: v1
kind: Service
metadata:
  name: {{ include "manager.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.flask.port }}
      protocol: TCP
